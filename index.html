r(--line);padding:17px 19px;border-radius:10px}.metric strong{font-weight:650;font-size:25px;display:block;line-height:1.4}.metric span{color:var(--muted);font-size:13px}.bullet-block{margin:12px 0;padding-left:22px}.bullet-block li{margin:8px 0}.action-bar{border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:30px;padding-top:22px}.primary{background:#293d50;color:white;border:1px solid #293d50;border-radius:8px;padding:11px 23px;font-weight:590;font-size:14px;min-height:44px}.primary:hover:not(:disabled){background:#192c3e}.secondary{background:white;color:#3c4c5c;border:1px solid #cfd5d9;border-radius:8px;padding:10px 21px;min-height:44px}.muted-btn{background:transparent;border:0;padding:10px;color:#596775}.tiny{font-size:12px;color:var(--muted)}.checkline{display:flex;align-items:flex-start;gap:10px;line-height:1.65;padding:9px 0;font-size:14px}.checkline input{margin-top:6px;accent-color:#384f65}.alert{padding:14px 17px;border-radius:9px;background:#faf3f2;color:#792e2e;border:1px solid #e9d7d4;font-size:14px}.error{color:#a62b2b;font-size:13px;min-height:20px}.success{background:#eff7f2;border:1px solid #d0e1d7;color:#225540;padding:16px;border-radius:9px}
.chat-page{max-width:1120px;padding-top:25px}.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:24px}.chat-layout.no-sources{grid-template-columns:minmax(0,1fr)}.chat-layout.no-sources .chat-column{width:100%;max-width:790px;margin:0 auto}.chat-column{min-width:0}.conversation-title{font-size:18px;font-weight:620;padding:9px 0 2px}.conversation-sub{font-size:12px;color:var(--muted)}.chat-stream{margin-top:26px}.msg{display:flex;gap:11px;margin:0 0 25px}.msg.user{justify-content:flex-end}.bubble-user{background:#f2f3f3;border-radius:14px 14px 5px 14px;padding:14px 18px;max-width:86%;font-size:14px;line-height:1.9}.assistant-avatar{height:28px;width:28px;border-radius:7px;background:#2e4356;color:white;display:grid;place-items:center;font-size:13px;flex:0 0 auto;margin-top:3px}.bubble-assistant{max-width:calc(100% - 38px);padding:0 4px;font-size:14px}.bubble-assistant p{margin:0 0 13px}.chat-name{font-size:12px;color:#6e7780;margin-bottom:7px;font-weight:600}.source-cite{background:none;border:0;padding:0 3px;vertical-align:super;color:#476c98;text-decoration:underline;font-size:11px;line-height:1.2;font-weight:700}.source-cite:hover{color:#1a4068}.source-panel{align-self:start;position:sticky;top:20px;border:1px solid var(--line);border-radius:11px;overflow:hidden}.source-head{padding:16px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:630}.source-caption{padding:13px 18px 0;font-size:12px;color:var(--muted)}.source-item{display:flex;gap:11px;text-align:left;width:100%;border:0;border-bottom:1px solid #ededed;background:#fff;padding:14px 18px}.source-item:last-child{border-bottom:0}.source-item:hover,.source-item.selected{background:#f5f7f8}.source-index{flex:0 0 21px;width:21px;height:21px;border:1px solid #d5dde3;border-radius:5px;font-size:12px;line-height:19px;text-align:center;color:#48627a}.source-name{font-size:12px;font-weight:600;line-height:1.7}.source-desc{font-size:11px;color:var(--muted);line-height:1.65}.source-detail{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:14px 16px;font-size:12px;background:#f9fafb}.source-detail b{display:block;margin-bottom:5px;font-weight:640}.source-note{font-size:12px;color:var(--muted);margin:15px 0 0}.chat-end{height:40px;border:1px solid var(--line);border-radius:30px;color:#a0a5aa;font-size:13px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin:30px 0 12px}.chat-end span:last-child{font-size:18px}
.question{padding:17px 0 23px;border-bottom:1px solid var(--line)}.question:first-child{padding-top:0}.question:last-child{border-bottom:0}.q-text{font-size:15px;margin-bottom:14px}.q-options{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;width:0;height:0}.choice label{display:flex;justify-content:center;align-items:center;border:1px solid #d9dcdf;background:#fff;min-height:41px;border-radius:8px;font-size:14px;cursor:pointer}.choice input:checked+label{background:#2a4155;border-color:#2a4155;color:#fff}.choice input:focus-visible+label{outline:3px solid #b0c3d3;outline-offset:2px}.scale-ends{display:flex;justify-content:space-between;color:#8e959b;font-size:11px;margin-top:6px}.question-group-title{font-size:16px;margin:22px 0 14px;font-weight:620}.verification-table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}.verification-table th,.verification-table td{border-bottom:1px solid var(--line);padding:11px 7px;text-align:left}.verification-table th{font-size:12px;color:var(--muted);font-weight:500}.calc{padding:15px 18px;border-radius:9px;background:#f5f7f8;font-size:15px}.calc b{font-size:20px}.readback{font-size:13px;color:var(--muted);padding:8px 0 0}.thanks{font-size:15px;line-height:1.9}

<body><div id="app"></div>
<script>
// GitHub Pages 公开前端配置。QuickForm POST 接口必须放在这里。
// 警告：公开网页的接口地址可被访问者查看；QuickForm 的部分版本支持通过任务 ID 查询全部答卷。
// 不要收集姓名、电话号码、真实病史等敏感信息。正式发放前核查数据访问权限。
window.IJIM_CONFIG = {
  QUICKFORM_POST_URL: 'https://quickform.cn/api/63bt80f6sc',
  STUDY_ID: 'IJIM-STUDY1-2026',
  MIN_CHAT_SECONDS: 12,
  MIN_VERIFY_SECONDS: 8
};

/* IJIM Study 1 · static GitHub Pages frontend. No tracking cookies or analytics. */
(() => {
  'use strict';
  const preview = window.IJIM_RESEARCH_PREVIEW === true;
  const CFG = window.IJIM_CONFIG || {};
  const KEY = preview ? 'ijim_study1_qf_preview_v7' : 'ijim_study1_qf_live_v7';
  const names = ['阅读说明','知识咨询','初步评价','独立核验','评价（一）','评价（二）','评价（三）','阅读理解','完成提交'];
  const conditions = {
    G1: {
      short: '未提供知识来源说明', name: '无来源披露（基线组）',
      description: '', refs: []
    },
    G2: {
      short: '健康专家意见', name: '健康领域专家知识摘要',
      description: '本次回答由健康知识助手参考平台提供的健康领域专家知识摘要形成。',
      refs: [
        ['健康领域专家知识摘要：活动建议','EX-PA-01 · 专家知识摘要','关于成年人每周有氧活动建议的专业知识摘要。'],
        ['健康领域专家知识摘要：强度换算','EX-PA-02 · 专家知识摘要','关于不同运动强度可以进行等效比较的知识摘要。'],
        ['AI 对专家知识的本次应用','AI-OUT-PA-03 · 模型分析摘要','健康知识助手结合上述知识摘要及本周运动记录给出的判断，并非专家本人对该个案的结论。']]
    },
    G3: {
      short: '权威健康数据库', name: '公共健康知识数据库',
      description: '本次回答由健康知识助手参考权威公共卫生指南条目形成。',
      refs: [
        ['WHO 成人身体活动建议','KB-WHO-PA-01 · 公共指南知识条目','资料依据：世界卫生组织关于成年人每周中等或高强度有氧身体活动的推荐。'],
        ['WHO 运动强度的等效组合','KB-WHO-PA-02 · 公共指南知识条目','资料依据：世界卫生组织关于不同强度有氧活动可进行等效组合的说明。'],
        ['AI 对数据库知识的本次应用','AI-OUT-PA-03 · 模型分析摘要','模型将指南规则应用到本周运动记录后得出的判断，属于生成内容，不代表 WHO 的独立核验结论。']]
    }
  };
  const scales = {
    pre: [
      ['TR1', '我对这个健康知识助手有信心。'],
      ['TR2', '我认为这个健康知识助手是可靠的。'],
      ['TR3', '我信任这个健康知识助手。']
    ],
    ev: [
      ['EV1', '这段回答被证实存在错误，符合我此前的预期。'],
      ['EV2', '得知这段回答存在错误，让我感到意外。'],
      ['EV3', '这段回答被证实错误的结果，与我此前的预期不符。']
    ],
    post: [
      ['TR1', '我对这个健康知识助手有信心。'],
      ['TR2', '我认为这个健康知识助手是可靠的。'],
      ['TR3', '我信任这个健康知识助手。']
    ],
    dis: [
      ['DIS1', '这次错误回答在多大程度上辜负了你对健康知识助手的期待？'],
      ['DIS2', '当你需要准确健康信息时，这个助手在多大程度上让你感到失望？'],
      ['DIS3', '这个健康知识助手在多大程度上未能提供你需要的信息支持？']
    ]
  };
  const app = document.getElementById('app');
  const initialState = () => ({
    version: 7, session_id: makeUUID(), condition: randomCondition(), stage: 0,
    started_at: new Date().toISOString(), stage_enter_at: Date.now(),
    consent: false, adult: false,
    answers: {pre:{}, ev:{}, post:{}, dis:{}}, checks: {MC1:'', SC1:null, SC2:null, SC3:null, MC3:''},
    read_seconds: {chat:0, verify:0},
    source_clicks: [], comprehension: '',
    submitted: false, submit_error: ''
  });
  let state;
  try { state = JSON.parse(sessionStorage.getItem(KEY)) || initialState(); }
  catch { state = initialState(); }
  if (!conditions[state.condition] || state.version !== 7) state = initialState();
  if (preview && conditions[window.IJIM_FORCE_CONDITION]) state.condition = window.IJIM_FORCE_CONDITION;
  let interval = null;
  let sending = false;
  let chosenSource = -1;
  function makeUUID(){
    if (crypto?.randomUUID) return crypto.randomUUID();
    // Usually only reached in older file:// local previews.
    const b = new Uint8Array(16); crypto.getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    return Array.from(b, (n,i) => n.toString(16).padStart(2,'0') + ([3,5,7,9].includes(i)?'-':'')).join('');
  }
  function randomCondition(){ const r = new Uint32Array(1); crypto.getRandomValues(r); return ['G1','G2','G3'][r[0] % 3]; }
  function save(){ try{ sessionStorage.setItem(KEY,JSON.stringify(state)); } catch(e) { /* storage may be disabled */ } }
  const h = x => String(x).replace(/[&<>"']/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[t]));
  const m = (s) => `<p>${s}</p>`;
  function stepShell(body, wide=false) {
    const active = Math.min(state.stage,8);
    const left = names.map((n,i) => `<div class="step ${i===active?'active':i<active?'complete':''}"><span class="num">${i+1}</span><span>${n}</span></div>`).join('');
    const previewTool = preview ? `<div style="padding:12px;border:1px solid #e1e4e6;background:#fff;border-radius:10px;font-size:12px"><b>仅研究人员预览</b><p style="color:#69747e;margin:4px 0 8px">不提交任何数据</p><select id="preview-condition" style="width:100%;padding:8px;border:1px solid #d5d9dc;border-radius:5px"><option value="G1" ${state.condition==='G1'?'selected':''}>G1 未披露来源</option><option value="G2" ${state.condition==='G2'?'selected':''}>G2 专家来源</option><option value="G3" ${state.condition==='G3'?'selected':''}>G3 数据库来源</option></select><button class="muted-btn" data-action="reset" style="font-size:12px">重置测试</button></div>` : '';
    return `<div class="shell"><aside class="sidebar"><div class="brand">知见<small>健康知识管理体验</small></div><div><div class="side-label">研究流程</div><nav class="steps" aria-label="研究流程">${left}</nav></div>${previewTool}<div class="side-foot">个人健康知识管理研究<br/>研究材料仅用于学术目的</div></aside><main class="main"><header class="topbar"><span class="topbar-title">健康知识管理体验研究</span><span class="topbar-status">${preview?'研究人员预览 · 不上传':'匿名研究 · 第 '+(active+1)+' / 9 步'}</span></header><div class="content ${wide?'chat-page':'narrow'}">${body}</div></main></div>`;
  }
  function buttons(next='继续',back=false,nextAction='next',disabled=false){
    return `<div class="action-bar">${back&&preview?'<button class="secondary" data-action="prev">上一步</button>':'<span class="tiny">请按顺序完成页面内容</span>'}<button class="primary" data-action="${nextAction}" ${disabled?'disabled':''}>${next}</button></div>`;
  }
  function intro(){return `<div class="eyebrow">研究说明 · 第一步</div><h1 class="h1">关于日常健康知识使用的一项研究</h1><p class="sub">请认真阅读。整个体验约需 5–8 分钟，页面展示的是模拟的健康知识咨询情景。</p><section class="panel soft"><p class="mini-title">请设想自己正处于以下情景</p><p>你最近开始整理自己的每周运动情况，希望知道运动量是否达到了成年人每周有氧身体活动的最低推荐量。</p><p>你已经记录了本周的两类身体活动，但不太确定不同运动强度能否合并计算。因此，你准备利用一款数字健康知识助手，帮助你了解相关知识并整理每周健康记录。</p><div class="metric-list"><div class="metric"><strong>95 分钟</strong><span>本周中等强度有氧活动</span></div><div class="metric"><strong>20 分钟</strong><span>本周高强度有氧活动</span></div></div><p class="note">这些运动记录是研究情景中预先设定的示例，并非要求你提供个人真实的健康数据。</p><div class="rule"></div><p class="mini-title">参加说明</p><p class="note">接下来你将阅读一段健康知识咨询记录，并对信息及使用体验作出评价。部分内容为研究情景材料，研究结束后将提供正确的信息解释。研究不会要求填写姓名、手机号、真实病史或真实运动记录。匿名答卷将由 QuickForm 第三方平台接收，研究负责人用于学术分析；该平台的任务链接可能存在数据查询权限风险。你可以在提交前停止参与。</p></section><section style="margin-top:18px"><label class="checkline"><input type="checkbox" data-check="adult" ${state.adult?'checked':''}><span>我已年满18周岁。</span></label><label class="checkline"><input type="checkbox" data-check="consent" ${state.consent?'checked':''}><span>我已阅读上述说明，知晓这是模拟情景，自愿参与匿名研究。</span></label></section><div id="inline-error" class="error"></div>${buttons('开始体验')}`;}
  function cite(n){return `<button class="source-cite" title="查看引用${n}" aria-label="查看引用${n}" data-source="${n-1}">[${n}]</button>`;}
  function chat(){
    const c = conditions[state.condition];
    const hasSource = c.refs.length > 0;
    const cited = n => hasSource ? cite(n) : '';
    const msgUser = t => `<div class="msg user"><div class="bubble-user">${t}</div></div>`;
    const msgAi = t => `<div class="msg"><div class="assistant-avatar" aria-hidden="true">知</div><div class="bubble-assistant"><div class="chat-name">健康知识助手</div>${t}</div></div>`;
    const refs = c.refs.map((r,i)=>`<button class="source-item ${chosenSource===i?'selected':''}" data-source="${i}"><span class="source-index">${i+1}</span><span><span class="source-name">${h(r[0])}</span><span class="source-desc">${h(r[1])}</span></span></button>`).join('');
    const detail = hasSource && chosenSource>=0 ? `<div class="source-detail"><b>[${chosenSource+1}] ${h(c.refs[chosenSource][0])}</b>${h(c.refs[chosenSource][2])}</div>` : `<div class="source-detail">点击正文中的 [1]、[2] 或 [3] 查看对应说明。</div>`;

  function pre(){return `<div class="eyebrow">初步评价 · 第三步</div><h1 class="h1">请评价刚才的知识咨询体验</h1><p class="sub">目前你尚未看到任何独立核验结果。请仅根据刚才的对话，对健康知识助手作出判断。</p>${questionBlock('pre',scales.pre)}<div id="inline-error" class="error" aria-live="polite"></div>${buttons('提交初步评价')}`;}
  function verify(){ return `<div class="eyebrow">信息核验 · 第四步</div><h1 class="h1">独立核验结果</h1><p class="sub">现在为你展示对上述回答的核验结果，请认真阅读。</p><div class="alert"><b>核验发现：健康知识助手此前的“已达标”结论不正确。</b></div><div class="space"></div><section class="panel"><p class="mini-title">核验标准</p><p>根据世界卫生组织（WHO）针对成年人的身体活动建议，每周至少应完成 <b>150 分钟中等强度有氧身体活动</b>，或 <b>75 分钟高强度有氧身体活动</b>，或达到两类活动的等效组合。</p><p>本次情景采用通常的等效换算：<b>1 分钟高强度活动约等于 2 分钟中等强度活动</b>。</p><div class="rule"></div><p class="mini-title">根据情景记录重新计算</p><table class="verification-table"><thead><tr><th>活动类型</th><th>实际时长</th><th>中等强度等效时长</th></tr></thead><tbody><tr><td>中等强度</td><td>95 分钟</td><td>95 分钟</td></tr><tr><td>高强度</td><td>20 分钟</td><td>40 分钟</td></tr><tr><td><b>合计</b></td><td>—</td><td><b>135 分钟</b></td></tr></tbody></table><div class="calc">95 + 20 × 2 = <b>135 分钟</b> &lt; 150 分钟</div><p><b>正确结论：</b>这份模拟运动记录尚未达到所比较的每周最低有氧活动推荐量，还差15分钟中等强度等效活动量。</p><p class="note">核验参考：世界卫生组织《身体活动和久坐行为指南》（2020）及公开身体活动建议。研究中的运动记录为虚拟数据，并非个体医疗建议。</p></section><div class="space"></div><p class="readback" id="read-wait"></p><div id="inline-error" class="error" aria-live="polite"></div>${buttons('阅读完毕，继续评价')}`; }

  function summary(){return `<div class="eyebrow">完成提交 · 第九步</div><h1 class="h1">问卷已填写完成</h1><p class="sub">感谢你认真阅读了情景材料并完成评价。</p><section class="panel soft"><p class="mini-title">提交说明</p><p>点击“提交匿名答卷”后，本次实验分组、量表评分、来源识别及理解评价、页面阅读时长等匿名数据将通过 HTTPS 发送到 QuickForm 平台。</p><p>本研究只记录匿名问卷评分、实验组别与阅读情况，不收集真实健康记录、姓名或联系方式。请不要提供个人身份信息。</p><p class="note">提交完成后会显示研究材料说明。如果网络断开，页面会显示失败提示，可重新提交。</p></section><div class="space"></div><div id="inline-error" class="error" aria-live="polite"></div>${buttons(preview?'结束模拟体验（不保存）':'提交匿名答卷', false,'submit')}`;}
  function debrief(){return `<div class="eyebrow">研究说明</div><h1 class="h1">感谢参与</h1><div class="success">${state.submitted?(state.queued?'平台已接收答卷并正在排队处理。':'你的匿名答卷已成功提交。'):'你已完成研究人员模拟预览，未上传任何数据。'}</div><div class="space"></div><section class="panel"><p class="mini-title">关于刚才的实验材料</p><p class="thanks">这项研究关注：当健康知识助手提供错误结论、随后被独立核验时，人们对该助手的评价和情绪体验如何变化。</p><p>刚才的 <b>95 分钟中等强度 + 20 分钟高强度</b> 是虚拟运动记录。先前聊天中的“已经达标”是研究设计的<b>故意错误结论</b>；正确计算为<b>135分钟中等强度等效活动</b>，尚未达到150分钟的比较标准。</p><p>专家组和数据库组页面中出现的部分知识记录编号仅是<b>研究构造的模拟来源卡片</b>，并非真实专家为该模拟案例做出的判断；WHO 的一般身体活动指南本身并未作出错误结论。错误来自模拟的大模型对资料的应用。</p><p><b>权威参考：</b> <a href="https://www.who.int/initiatives/behealthy/physical-activity" target="_blank" rel="noopener noreferrer">WHO：Physical activity</a>，<a href="https://www.ncbi.nlm.nih.gov/books/NBK566046/" target="_blank" rel="noopener noreferrer">WHO Guidelines on physical activity and sedentary behaviour</a>。</p><p class="note">请勿将实验中的错误聊天结论当作真实健康建议。如需具体运动建议，请咨询合格的医疗或健康专业人员。</p></section>${preview?'<div class="action-bar"><button class="secondary" data-action="reset">重新开始预览</button></div>':''}`;}
  function render(scroll=true){
    clearInterval(interval); interval = null;
    let body;
    switch(state.stage){case 0:body=intro();break;case 1:body=chat();break;case 2:body=pre();break;case 3:body=verify();break;case 4:body=ev();break;case 5:body=post();break;case 6:body=dis();break;case 7:body=checks();break;case 8:body=summary();break;default:body=debrief();}
    app.innerHTML=stepShell(body,state.stage===1);
    if(scroll) window.scrollTo({top:0,behavior:'auto'});
    if ([1,3].includes(state.stage) && !preview){
      interval=setInterval(updateTimer,600);updateTimer();
    }
    save();
  }
  function readTime(){return Math.max(0, Math.floor((Date.now()-state.stage_enter_at)/1000));}
  function updateTimer(){
    if (state.stage !== 1 && state.stage !== 3) return;
    const need = state.stage===1 ? (CFG.MIN_CHAT_SECONDS||12) : (CFG.MIN_VERIFY_SECONDS||8);
    const remaining=Math.max(0, need-readTime());
    const next=app.querySelector('[data-action="next"]');
    if (next) next.disabled=remaining>0;
    const waiting=app.querySelector('#read-wait');
    if (waiting) waiting.textContent=remaining>0?`请认真阅读核验信息（约 ${remaining} 秒后可继续）。`:'请继续完成后续体验评价。';
  }
  function msg(s){const e=app.querySelector('#inline-error'); if(e)e.textContent=s;}
  function validate(){
    if(state.stage===0 && (!state.adult || !state.consent))return '请确认已成年并同意参与。';
    if(state.stage===1 && !preview && readTime() < (CFG.MIN_CHAT_SECONDS||12))return '请阅读完整的咨询对话。';
    if(state.stage===3 && !preview && readTime() < (CFG.MIN_VERIFY_SECONDS||8))return '请认真阅读核验信息。';
    if(state.stage===7){
      if(!state.checks.MC1 || !state.checks.MC3 || !state.comprehension || !['SC1','SC2','SC3'].every(k=>Number.isInteger(state.checks[k]))) return '还有阅读理解题未作答，请完成所有题目。';
    }
    const map={2:'pre',4:'ev',5:'post',6:'dis'};
    const type=map[state.stage];
    if(type && !scales[type].every(([id])=>Number.isInteger(state.answers[type][id])))return '还有题目未回答，请完成当前页所有评分。';
    return '';
  }
  function next(){
    const error=validate(); if(error){msg(error);return;}
    if(state.stage===1) state.read_seconds.chat=readTime();
    if(state.stage===3) state.read_seconds.verify=readTime();

  function mean(obj){const v=Object.values(obj).map(Number);return Math.round(v.reduce((a,b)=>a+b,0)/v.length*1000)/1000;}

    return {

      session_id: state.session_id,
      group_code: state.condition,
      source_type: conditions[state.condition].short,
      source_disclosure: state.condition==='G1' ? 'undisclosed' : (state.condition==='G2'?'expert':'database'),
      TR1_pre:state.answers.pre.TR1, TR2_pre:state.answers.pre.TR2, TR3_pre:state.answers.pre.TR3,
      TR1_post:state.answers.post.TR1, TR2_post:state.answers.post.TR2, TR3_post:state.answers.post.TR3,

  async function submit(){
    if(sending || state.submitted)return;
    if(preview){state.stage=9;state.submitted=false;render();return;}
    const endpoint=String(CFG.QUICKFORM_POST_URL||'');
    if(!/^https:\/\/quickform\.cn\/api\/[a-zA-Z0-9_-]+$/.test(endpoint)){
      msg('数据收集接口尚未正确配置，请联系研究负责人。答卷尚未上传。');return;
    }
    sending=true; msg('正在提交，请不要关闭页面……');
    const button=app.querySelector('[data-action="submit"]');if(button)button.disabled=true;
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),20000);
      let response;
      try{
        response=await fetch(endpoint,{
          method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(payload()),signal:controller.signal
        });
      }finally{clearTimeout(timeout);}
      let data=null;
      try{data=await response.json();}catch{}
      const acknowledged = response.status===202 || data?.status==='success' || data?.success===true;
      if(!response.ok || !acknowledged || (data && (data.success===false || data.status==='error'))){
        throw new Error(data?.message || data?.error || '未收到 QuickForm 的有效成功确认（HTTP '+response.status+'）');
      }
      // QuickForm 202 响应意味着入队接收，尚非最终落库。
      state.submitted=true;
      state.queued=response.status===202 || data?.queued===true;
      state.stage=9;
      render();
    }catch(err){
      msg('提交尚未得到确认，请检查网络后重试。若网络刚好中断，可能造成重复记录，请研究者按 session_id 去重。错误：'+String(err?.message||err));
      if(button)button.disabled=false;
    }finally{sending=false;}
  }

    if(t.dataset.check){state[t.dataset.check]=t.checked;save();}
    if(t.dataset.scale && scales[t.dataset.scale]){state.answers[t.dataset.scale][t.dataset.item]=Number(t.value);save();}
    if(t.name==='comprehension'){state.comprehension=t.value;save();}
    if(t.name==='MC1'||t.name==='MC3'){state.checks[t.name]=t.value;save();}
    if(['SC1','SC2','SC3'].includes(t.name)){state.checks[t.name]=Number(t.value);save();}
    if(t.id==='preview-condition' && preview){state.condition=t.value;chosenSource=-1;save();render();}
  });
  render();
})();
</script>
</body>
</html>
